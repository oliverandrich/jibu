name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # `./` rather than the `$/` zizmor's `self-repository` audit asks for: actionlint rejects `$/`.
    uses: ./.github/workflows/gate.yml # zizmor: ignore[self-repository]

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Kept equal to `[tools]` in mise.toml by hand.
          version: 1.30.1
          advanced-security: true
