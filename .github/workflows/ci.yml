name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      # One red leg must not hide the others.
      fail-fast: false
      matrix:
        include:
          # The pinned pair from mise.toml, running the full gate.
          - name: check
          # The floor of the `elixir` requirement in mix.exs. Compatibility only, no style judgement.
          - name: floor (elixir 1.18)
            elixir: "1.18"
            erlang: "27"
            gate: build-and-test

    env:
      GATE: ${{ matrix.gate || 'check' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pin the toolchain this leg is for
        if: matrix.elixir
        env:
          ELIXIR: ${{ matrix.elixir }}
          ERLANG: ${{ matrix.erlang }}
        run: printf '[tools]\nelixir = "%s"\nerlang = "%s"\n' "$ELIXIR" "$ERLANG" > mise.local.toml

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache_key_prefix: mise-${{ matrix.elixir || 'pinned' }}-${{ matrix.erlang || 'pinned' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.name }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.name }}-${{ hashFiles('mise.toml') }}-

      - name: Fetch dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Run the gate
        run: mise run "$GATE"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Kept equal to `[tools]` in mise.toml by hand.
          version: 1.30.1
          advanced-security: true
