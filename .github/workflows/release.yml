name: Release

# Only a version tag. A branch push must never reach the job that holds the hex.pm key.
on:
  push:
    tags: ["v*"]

  # A dry run: `release-check` and the gate run, and an untagged HEAD fails `release-check`.
  # `publish` and `announce` run only on a tag push, so a dispatch never reaches the key.
  workflow_dispatch:

# Keyed on the tag. No cancel-in-progress: cancelling `mix hex.publish` can burn a version number.
concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  # Tag and version are compared before anything is built.
  tag:
    name: tag
    runs-on: ubuntu-latest

    steps:
      # `release-check` reads the tags, which a shallow checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Pinned, like Hex below: the release path should not pick up a mise released minutes ago.
          version: 2026.10.7
          cache: false

      - name: Check the tag against the version
        run: mise run release-check

  # The same gate as CI, built without any cache.
  verify:
    uses: ./.github/workflows/gate.yml # zizmor: ignore[self-repository]
    needs: tag
    with:
      hardened: true

  # The smallest job, because it is the only one that can read HEX_API_KEY.
  # The `hex` environment requires a reviewer, so a tag proposes a release and a person allows it.
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [tag, verify]
    if: github.event_name == 'push'
    environment: hex

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Pinned, like Hex below: the release path should not pick up a mise released minutes ago.
          version: 2026.10.7
          cache: false

      - name: Fetch dependencies
        run: |
          # Pinned: this job sends HEX_API_KEY, and an unpinned install fetches whatever is current.
          mix local.hex 2.5.1 --force
          mix local.rebar --force
          mix deps.get

      # Dependency build scripts run here, in a step without HEX_API_KEY.
      - name: Compile
        run: mix compile

      # Asked again in the job that publishes, so a later edit cannot route around it.
      - name: Check the tag against the version
        run: mise run release-check

      # Sends the package and the documentation. hex.pm allows a revert for one hour only.
      - name: Publish to hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

  # After hex.pm, so no GitHub release announces a version that failed to publish.
  # Its own job, because it needs contents: write and the publish job must not have it.
  announce:
    name: announce
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the notes out of the changelog
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"

          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section to use as release notes."
            exit 1
          fi

          cat release-notes.md

      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$REF_NAME" --repo "$REPO" --notes-file release-notes.md
